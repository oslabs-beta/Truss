name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    name: Build, test, and architecture check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run Truss architecture check
        run: npm run truss:check

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: npm run docker:build

      - name: Verify Docker CLI starts
        run: npm run docker:help
